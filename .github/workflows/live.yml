name: Live contract (nightly)

# Runs the live suite against Nace production on the newest AI SDK the version
# ranges allow, so a breaking change upstream shows up before users hit it.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      NACE_LIVE_API_KEY: ${{ secrets.NACE_API_KEY_LIVE }}
      NACE_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm update ai @ai-sdk/provider @ai-sdk/provider-utils
      - run: pnpm list ai @ai-sdk/provider @ai-sdk/provider-utils
      - run: pnpm test
      - run: pnpm test:live
